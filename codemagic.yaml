# Бесплатная сборка IPA на Mac (обход очереди GitHub Actions)
workflows:
  ios-sideloadly:
    name: iOS IPA for Sideloadly
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Flutter pub get
        script: |
          flutter pub get
      - name: Build iOS unsigned
        script: |
          flutter build ios --release --no-codesign
      - name: Package IPA
        script: |
          set -e
          APP_PATH="build/ios/iphoneos/Runner.app"
          if [ ! -d "$APP_PATH" ]; then
            APP_PATH="$(find build/ios -name 'Runner.app' -type d | head -n 1)"
          fi
          echo "Packaging: $APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qr "$CM_BUILD_DIR/qr_checkin.ipa" Payload
          ls -lh "$CM_BUILD_DIR/qr_checkin.ipa"
    artifacts:
      - qr_checkin.ipa
